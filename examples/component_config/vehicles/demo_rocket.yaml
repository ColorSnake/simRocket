# Dane pojazdu z test_fmu.json; niezależne od wyboru IMU.
schema: simrocket/vehicle-v1
id: demo-liquid-rocket
rocket:
  engines:
  - engine_id: 0
    type: liquid
    max_thrust_vac_n: 5000.0
    max_thrust_sl_n: 4200.0
    max_mass_flow_kg_s: 2.0
  actuators:
  - actuator_id: 0
    engine_id: 0
    position_m:
    - 0.0
    - 0.0
    - -2.5
  mass:
    type: dynamic
    dry_mass_kg: 20.0
    inertia_diagonal_kg_m2:
    - 50.0
    - 50.0
    - 1.0
    dry_cg_z_m: 0.0
    tanks:
    - tank_id: 0
      z_bottom_m: 0.5
      radius_m: 0.2
      max_height_m: 1.5
      propellant_density_kg_m3: 1141.0
      mass_kg: 50.0
    - tank_id: 1
      z_bottom_m: 2.2
      radius_m: 0.2
      max_height_m: 1.2
      propellant_density_kg_m3: 820.0
      mass_kg: 30.0
  aerodynamics:
    drag_coefficient: 0.35
    normal_force_coefficient: 1.5
    reference_area_m2: 0.0706
    center_of_pressure_z_m: -1.8
    pitch_yaw_damping_coefficient: 0.02
    roll_damping_coefficient: 0.01
visuals:
  rocket_length_m: 3.0
  rocket_radius_m: 0.15
